[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-schedule"
version = "1.0.0"
description = "Fictional aircraft program schedule assurance and quantitative risk analysis"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "networkx>=3.4,<4", "matplotlib>=3.8,<4", "reportlab>=4,<5"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian = ["*.html"]
