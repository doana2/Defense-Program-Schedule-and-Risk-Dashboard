<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERIDIAN | Schedule & Risk</title>
<style>
:root{--navy:#122a40;--blue:#3765a0;--muted:#677a8c;--line:#dce4ed;--red:#b64640;--bg:#f1f5f9;--green:#177c71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.5 Arial,sans-serif}header{background:var(--navy);color:white;padding:26px 40px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:27px;margin:0;letter-spacing:1px}header p{margin:4px 0;color:#b6c9dd}header small{color:#d2deea}.shell{max-width:1520px;margin:auto;padding:24px 36px}nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}nav button{border:0;background:none;padding:12px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}nav button.active{color:var(--blue);border-color:var(--blue)}h2{font-size:23px;margin:4px 0 8px}h3{font-size:17px;margin:0 0 16px}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:20px 0}.kpi{background:white;padding:18px 22px;border-top:3px solid var(--blue)}.kpi strong{display:block;font-size:29px;margin:7px 0}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel{background:white;padding:24px;border:1px solid var(--line);border-radius:4px;margin-bottom:20px;overflow:hidden}.note{padding:12px 16px;background:#e7edf5;border-left:3px solid var(--blue);margin:15px 0}.warn{color:var(--red)}.table-wrap{overflow:auto;max-height:650px}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);background:#f1f5f9;position:sticky;top:0;z-index:1}td,th{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#f6f9fc}.tag{white-space:nowrap;font-size:11px;font-weight:bold;padding:4px 7px;border-radius:3px;background:#e5eef7;color:var(--blue)}.tag.red{background:#fae9e7;color:var(--red)}.tag.green{background:#e1f2ed;color:var(--green)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}input,select{border:1px solid #bbcbdc;padding:10px 12px;border-radius:4px;background:white;color:var(--navy);font:inherit}input{min-width:280px}.barrow{display:grid;grid-template-columns:170px 1fr 54px;gap:12px;align-items:center;margin:16px 0}.track{height:15px;background:#edf2f7}.fill{height:100%;background:var(--blue)}.barrow span{font-size:12px}.legend{display:flex;gap:20px;color:var(--muted);font-size:12px;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--blue)}svg{width:100%;height:auto}footer{text-align:center;padding:20px;font-size:11px;color:var(--muted)}.hidden{display:none}a{color:var(--blue)}@media(max-width:950px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.shell{padding:18px}header{padding:20px}.barrow{grid-template-columns:140px 1fr 45px}}
@media(max-width:520px){header{display:block}header>div+div{margin-top:16px}.kpis{grid-template-columns:1fr}.kpi strong{font-size:26px}.panel{padding:16px}nav button{padding:10px 12px}}
</style></head><body><header><div><h1>MERIDIAN <span style="font-weight:400;color:#9ab9d8">M-27</span></h1><p>Aircraft development · Schedule assurance & risk</p></div><div><small>FICTIONAL / UNCLASSIFIED</small><p id="status"></p></div></header><main class="shell"><nav id="nav"></nav><section id="content"></section></main><footer>Portfolio demonstration. No government or operational data. Offline dashboard companion; not a Tableau screenshot.</footer>
<script>
const D=__DATA__,S=D.summary,$=s=>document.querySelector(s);let tab='Overview';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:1});
const tag=x=>`<span class="tag ${['At risk','Missed','REVIEW','Critical','Rejected'].includes(x)?'red':['PASS','Complete','Approved'].includes(x)?'green':''}">${esc(x)}</span>`;
const table=(rows,cols)=>`<div class="table-wrap"><table><thead><tr>${cols.map(([key,label])=>`<th>${label}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(([key,label,fn])=>`<td>${fn?fn(r[key],r):esc(r[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const kpi=(label,value,note)=>`<div class="kpi">${label}<strong>${value}</strong><span>${note}</span></div>`;
const bars=(rows,max,color='#3765a0')=>rows.map(([name,v])=>`<div class="barrow"><span>${esc(name)}</span><div class="track"><div class="fill" style="width:${Math.min(100,v/max*100)}%;background:${color}"></div></div><b>${num(v)}</b></div>`).join('');
const phases=['Engineering','Software','Logistics','Testing','Delivery'],colors=['#3765a0','#14857a','#ad7c35','#815ca4','#42754a'];
function gantt(){const max=Math.max(...D.schedule_analysis.map(r=>r.finish_day))+10;let svg=`<svg viewBox="0 0 760 300" role="img" aria-label="Baseline and current phase schedule">`;
for(let d=0;d<=max;d+=60){let x=150+d/max*570;svg+=`<line x1="${x}" x2="${x}" y1="15" y2="260" stroke="#e2e8f0"/><text x="${x}" y="285" text-anchor="middle" font-size="11" fill="#677a8c">Day ${d}</text>`}
phases.forEach((p,i)=>{let rows=D.schedule_analysis.filter(r=>r.phase==p);let st=Math.min(...rows.map(r=>r.start_day)),fi=Math.max(...rows.map(r=>r.finish_day));let bs=Math.min(...rows.map(r=>businessDay(r.baseline_start))),bf=Math.max(...rows.map(r=>businessDay(r.baseline_finish)));let y=30+i*47;svg+=`<text x="0" y="${y+10}" font-size="13" fill="#122a40">${p}</text><rect x="${150+bs/max*570}" y="${y-5}" width="${(bf-bs)/max*570}" height="8" fill="#bdcad8"/><rect x="${150+st/max*570}" y="${y+7}" width="${(fi-st)/max*570}" height="13" fill="${colors[i]}"/>`});let sd=businessDay(S.status);svg+=`<line x1="${150+sd/max*570}" x2="${150+sd/max*570}" y1="10" y2="262" stroke="#b64640" stroke-dasharray="4"/></svg>`;return svg}
function businessDay(date){let a=new Date('2026-04-06T00:00:00Z'),b=new Date(date+'T00:00:00Z'),n=0;while(a<b){if(a.getUTCDay()!=0&&a.getUTCDay()!=6)n++;a.setUTCDate(a.getUTCDate()+1)}return n}
function overview(){return `<h2>Program schedule review</h2><div class="muted">Approved baseline, current forecast and modeled uncertainty · status at start of day</div><div class="kpis">${kpi('Current acceptance',S.forecast_finish,`${num(S.slip_days)} workdays after baseline`)}${kpi('P80 completion',S.p80_date,`${num(S.trials)} trials · seed ${S.seed}`)}${kpi('At-risk milestones',S.at_risk_milestones,`of ${S.milestones} total milestones`)}${kpi('Resource overload',num(S.overloaded_resource_days),'resource-days above capacity')}</div><div class="grid"><div class="panel"><h3>Baseline and current phase schedule</h3>${gantt()}<div class="legend"><span><i class="dot" style="background:#bdcad8"></i>Baseline</span><span><i class="dot"></i>Current</span><span>Dashed line: status date</span></div></div><div class="panel"><h3>Schedule assurance</h3>${bars([['Completed items',S.completed],['Critical remaining',S.critical],['Near-critical remaining',S.near_critical],['Negative float remaining',S.negative_float]],S.tasks)}<div class="note">${S.health_review} of 14 health indicators need review. Resource conflicts have not been leveled.</div></div></div><div class="panel"><h3>Upcoming acceptance gates</h3>${table(D.milestones.filter(r=>r.percent_complete<100).sort((a,b)=>a.current_finish.localeCompare(b.current_finish)).slice(0,7),[['wbs','WBS'],['name','Milestone'],['baseline_finish','Baseline'],['current_finish','Forecast'],['p80_date','P80'],['risk_status','Status',tag]])}</div>`}
function schedule(){return `<h2>Integrated schedule</h2><div class="muted">${S.tasks} leaf records · ${S.dependencies} FS / SS / FF dependencies · finish dates are exclusive boundaries</div><div class="controls"><input id="search" placeholder="Search task, WBS or work package" aria-label="Search schedule"><select id="phase" aria-label="Phase"><option>All phases</option>${phases.map(p=>`<option>${p}</option>`).join('')}</select><select id="path" aria-label="Path status"><option>All paths</option><option>Critical</option><option>Near-critical</option><option>Noncritical</option><option>Complete</option></select></div><div class="panel"><div id="count" class="muted"></div><div id="schedule-table"></div></div>`}
function filterSchedule(){const q=$('#search').value.toLowerCase(),p=$('#phase').value,k=$('#path').value;const rows=D.schedule_analysis.filter(r=>(p=='All phases'||r.phase==p)&&(k=='All paths'||r.path_status==k)&&`${r.name} ${r.wbs} ${r.id} ${r.work_package}`.toLowerCase().includes(q));$('#count').textContent=`${rows.length} matching tasks`;$('#schedule-table').innerHTML=table(rows,[['id','ID'],['wbs','WBS'],['name','Activity'],['current_start','Start'],['current_finish','Finish'],['finish_variance','Slip',num],['network_float','Network float',num],['total_float','Deadline float',num],['percent_complete','% complete'],['path_status','Path',tag],['id','Predecessors',v=>D.dependencies.filter(e=>e.succ==v).map(e=>`${e.pred} ${e.type}${e.lag?' +'+e.lag+'d':''}`).join('<br>')]])}
function risks(){return `<h2>Risk register</h2><div class="muted">Probabilities and impacts are fictional estimates. Exposure is task-level, not additive program delay.</div><div class="grid" style="margin-top:20px"><div class="panel"><h3>Expected task-level exposure</h3>${bars(D.risks.map(r=>[r.title,r.expected_impact_days]),Math.max(...D.risks.map(r=>r.expected_impact_days)),'#ad7c35')}</div><div class="panel"><h3>Simulation results</h3>${kpi('P50',S.p50_date,'Half of simulated completions by this date')}${kpi('P80',S.p80_date,'80% of simulated completions by this date')}${kpi('Meet baseline',`${(S.on_time_probability*100).toFixed(1)}%`,S.deadline)}<p class="muted">Triangular remaining duration + discrete risk occurrences. Actuals fixed. No resource leveling.</p></div></div><div class="panel">${table(D.risks,[['risk_id','Risk'],['title','Description'],['probability','Probability',v=>(v*100).toFixed(0)+'%'],['impact_low','Low d'],['impact_mode','Mode d'],['impact_high','High d'],['task_ids','Affected task'],['owner','Owner'],['mitigation','Mitigation']])}</div>`}
function resources(){let rows=D.resources.map(r=>{let entries=D.resource_load.filter(x=>x.resource_id==r.resource_id);return {...r,peak:Math.max(0,...entries.map(x=>x.demand_fte)),over:entries.filter(x=>x.excess_fte>0).length}});return `<h2>Resource workload conflicts</h2><div class="note">One unit = one full-time person. Daily demand assumes uniform effort. No automatic leveling or capacity-driven date changes.</div><div class="panel">${table(rows,[['resource_id','Pool'],['name','Team'],['capacity_fte','Capacity FTE'],['peak','Peak demand FTE',num],['over','Overloaded days']])}</div><div class="panel"><h3>Daily conflicts</h3>${table(D.resource_conflicts,[['date','Date'],['resource_id','Pool'],['demand_fte','Demand',num],['capacity_fte','Capacity',num],['excess_fte','Excess',num],['task_ids','Concurrent activities']])}</div>`}
function health(){return `<h2>14-point schedule-health screen</h2><div class="note">DCMA-inspired demonstration thresholds, not certification. Denominators and exceptions appear below. Milestones are excluded from detail-activity metrics.</div><div class="panel">${table(D.health,[['point','#'],['indicator','Indicator'],['value','Result',(v,r)=>v==null?'N/A':r.point<12?(v*100).toFixed(1)+'%':Number(v).toFixed(3)],['numerator','Numerator',num],['denominator','Denominator',num],['threshold','Threshold',(v,r)=>(r.direction=='min'?'≥ ':'≤ ')+(r.point<12?(v*100).toFixed(0)+'%':v)],['status','Status',tag],['basis','Population / method']])}</div><div class="panel"><h3>Activity-level findings</h3>${table(D.diagnostics,[['check','Check'],['task_id','Task'],['detail','Finding']])}</div>`}
function changes(){return `<h2>Schedule change control</h2><div class="note">Read-only audit view. Only CR-001 is applied to the current forecast. Pending/rejected requests do not alter dates. No rebaseline has occurred.</div><div class="panel">${table(D.changes,[['change_id','Request'],['task_id','Task'],['field','Field'],['old_value','Before'],['new_value','Requested'],['status','Status',tag],['owner','Owner'],['reason','Reason']])}</div><div class="panel"><h3>Approval history</h3>${table(D.change_history,[['timestamp','Event time'],['change_id','Request'],['actor','Actor'],['from_status','From'],['to_status','To',tag],['comment','Decision record']])}</div>`}
const screens={Overview:overview,Schedule:schedule,Risks:risks,Resources:resources,Health:health,Changes:changes};
function render(){ $('#nav').innerHTML=Object.keys(screens).map(t=>`<button class="${t==tab?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#content').innerHTML=screens[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab=='Schedule'){['search','phase','path'].forEach(id=>$('#'+id).addEventListener('input',filterSchedule));filterSchedule()}}
$('#status').textContent='Status: '+S.status;render();
</script></body></html>
